[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "helmfem"
version = "1.0.0"
description = "Vectorised P1 finite elements for the 2D Helmholtz equation, with acoustic case studies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bastien Cetre" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.12", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["helmfem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
